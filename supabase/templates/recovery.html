<!--
  The "Reset Password" email — Supabase dashboard → Authentication → Email
  Templates → Reset Password. Paste the body below into the template box; the
  subject can stay "Reset Your Password".

  WHY THIS EXISTS. The stock template links to {{ .ConfirmationURL }}, which is
  Supabase's own /verify endpoint: it spends the one-time token on the GET and
  redirects to our page with a session in the URL hash. Microsoft opens every
  link in an inbox before the person does (Safe Links, Outlook, Microsoft 365),
  so for those families the token is gone by the time they tap — Frank Watson,
  10 Sep 2026: "2 minutes later she gets the email and clicks the link to reset
  password then it errors and says the link is expired."

  This template links to OUR page instead, carrying the unspent {{ .TokenHash }}
  in the query. {{ .RedirectTo }} is the redirectTo the app passes to
  resetPasswordForEmail — https://portal.novapa.org/reset-password — so the
  same template serves a preview deploy without editing, and it does not
  depend on the project's Site URL, which three apps share.

  Loading the page does nothing. The token is exchanged when the parent
  presses Save (src/app/reset-password/reset-form.tsx, verifyOtp), so a
  scanner that fetched the link first got a form and not a session.

  The page still accepts the stock link too, so nothing breaks if this is not
  pasted — it just keeps failing for Outlook families until it is.
-->
<h2>Reset your password</h2>

<p>Someone — hopefully you — asked to reset the password for the NOVA PA Parent Portal.</p>

<p>
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery">
    Choose a new password
  </a>
</p>

<p>The link is good for one hour and works once. If you didn't ask for this, you can ignore it — nothing changes until a new password is saved.</p>

<p>NOVA PA · portal.novapa.org</p>
